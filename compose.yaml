name: aicorp-week1
services:
  db:
    # PostgreSQL 17.11; digest pins the multi-platform image used for validation.
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup_local.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aicorp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
